[project]
name = "foreman"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# tests/smoke dispatches real agents; `make smoke` selects it explicitly.
addopts = ["-m", "not smoke"]
markers = ["smoke: end-to-end run against the real claude-local backend"]

[tool.setuptools]
packages = ["foreman"]
