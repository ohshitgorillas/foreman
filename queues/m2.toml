[steps.3e-core-config.form]
origin = { design = "docs/superpowers/specs/m2-launcher-kinds-design.md", steps = ["3e"] }

[[steps.3e-core-config.form.behaviors]]
text = "readiness_timeout_seconds and every proxy limit are positive integers, excluding bool. Reject zero, negative, noninteger and boolean values at $.readiness_timeout_seconds or $.proxy_limits.<field>; reject unknown mapping members and a nonobject mapping. config_problems reports the same constraints for direct records."
source = "gauntlet/core/config.py"

[[steps.3e-core-config.form.behaviors]]
text = "Require uppercase HTTP-token methods and exact origin-form paths without query, fragment, wildcard, credentials, traversal or ambiguous encoding. Query names are nonempty literal names without URI delimiters or controls. Reject unknown fields, invalid types and duplicate method/path entries within the extension list at $.proxy_extra_routes[index].<field>. config_problems applies the same constraints to direct records."
source = "gauntlet/core/config.py"

[[steps.3e-core-config.form.behaviors]]
text = "Missing values use the canonical defaults."
source = "gauntlet/core/records.py"

