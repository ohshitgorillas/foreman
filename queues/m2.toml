# Gauntlet M2, Order steps 1-3g, in validated role/shape/form format.
# Build selectors resolve from each referenced red producer report.

[groups.g1]
steps = ["1", "2", "3"]
design = "docs/superpowers/specs/m2-launcher-kinds-design.md"
after = []

[steps.1]
role = "core-builder"
shape = "stub"
paths = ["gauntlet/core/errors.py"]

[steps.1.form]
step = """1 stub | core-builder | gauntlet/core/errors.py | New typed constructors raise only.
class ProcessError(GauntletError):
    operation: str
    status: int | None
    reason: str

    def __init__(self, operation: str, status: int | None, reason: str) -> None: ...


class LaunchError(GauntletError):
    component: str
    reason: str

    def __init__(self, component: str, reason: str) -> None: ..."""

[steps.2]
role = "test-writer"
shape = "red"
paths = ["tests/test_core_errors.py"]
views = ["gauntlet/core/errors.py"]
check = ["uv", "run", "pytest", "-q", "tests/test_core_errors.py"]
expect_code = 1

[steps.2.form]
origin = { design = "docs/superpowers/specs/m2-launcher-kinds-design.md", steps = ["2"] }

[[steps.2.form.behaviors]]
text = "New errors preserve safe data and hierarchy."
source = "gauntlet/core/errors.py"

[[steps.2.form.behaviors]]
text = "Errors carry safe operation identifiers and bounded reasons, not credentials, request bodies, inherited environments or arbitrary process output."
source = "gauntlet/core/errors.py"

[steps.3]
role = "core-builder"
shape = "build"
paths = ["gauntlet/core/errors.py"]
check = ["uv", "run", "pytest", "-q", "tests/test_core_errors.py"]

[steps.3.form]
step = """docs/superpowers/specs/m2-launcher-kinds-design.md, Order step 3
3 build | core-builder | gauntlet/core/errors.py | Typed-error constructor and hierarchy tests must pass."""
red = [{ step = "2" }]

[groups.g2]
steps = ["3a", "3b", "3c"]
design = "docs/superpowers/specs/m2-launcher-kinds-design.md"
after = ["g1"]

[steps.3a]
role = "seam-builder"
shape = "stub"
paths = ["gauntlet/seams/readiness.py"]

[steps.3a.form]
step = """3a stub | seam-builder | gauntlet/seams/readiness.py | Complete Clock/Readiness interfaces before process consumers.
type Ready = Callable[[float | None], bool]


class Clock(Protocol):
    def wait(self, ready: Ready, seconds: float | None) -> bool: ...


class SystemClock:
    def wait(self, ready: Ready, seconds: float | None) -> bool: ...


SYSTEM: Clock


class Readiness(Protocol):
    def unix(
        self, path: Path, *, seconds: int, start: Callable[[float], None]
    ) -> None: ...
    def tcp(
        self, host: str, port: int, *, seconds: int, start: Callable[[float], None]
    ) -> None: ...


class SocketReadiness:
    def __init__(self, *, clock: Clock = SYSTEM) -> None: ...
    def unix(
        self, path: Path, *, seconds: int, start: Callable[[float], None]
    ) -> None: ...
    def tcp(
        self, host: str, port: int, *, seconds: int, start: Callable[[float], None]
    ) -> None: ..."""

[steps.3b]
role = "test-writer"
shape = "red"
paths = ["tests/test_seams_readiness.py"]
views = ["gauntlet/seams/readiness.py"]
check = ["uv", "run", "pytest", "-q", "tests/test_seams_readiness.py"]
expect_code = 1

[steps.3b.form]
origin = { design = "docs/superpowers/specs/m2-launcher-kinds-design.md", steps = ["3b"] }

[[steps.3b.form.behaviors]]
