[[steps.3e-seams-config.form.behaviors]]
text = "gauntlet.yaml accepts readiness_timeout_seconds, shared by proxy and relay startup, and an optional proxy_limits mapping. Missing mapping members retain 64 KiB headers, 32 MiB streamed request bodies and eight concurrent requests per sidecar."
