target_repo = "~/dev/gauntlet"
worktree_root = "~/dev/foreman-worktrees"
state_dir = "~/dev/foreman/state-g7"
check_cmd = ["make", "check"]
format_cmd = ["uv", "run", "ruff", "format"]
backend = "claude-local"
view_cmd = ["uv", "run", "stubgen"]
view_root = "~/dev/foreman-views"
batch_budget = 300
dispatch_seconds = 600

[[reviewers]]
role = "diff-reviewer"
paths = ["gauntlet", "gates", "pyproject.toml", "uv.lock", "Makefile", ".pre-commit-config.yaml", ".gitignore", "conftest.py", "tests/support"]

[[reviewers]]
role = "test-reviewer"
paths = ["tests"]
