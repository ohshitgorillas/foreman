# Copy to foreman.toml and edit.
target_repo = "~/dev/gauntlet"
worktree_root = "~/dev/foreman-worktrees"
state_dir = "~/dev/foreman/state"
check_cmd = ["make", "check"]
format_cmd = ["uv", "run", "ruff", "format"]
backend = "claude-local" # or "codex-local"
view_cmd = ["uv", "run", "stubgen"]
view_root = "~/dev/foreman/views"
# Enclosing-unit lines per finding batch: an unmeasured starting value.
# The owner tunes this budget from dispatch records.
batch_budget = 300
dispatch_seconds = 600 # ten-minute agent cap
juror_rounds = 2 # optional; attempts per failing step or group-check context
# Reruns per step or reviewer for a refused report or rejected red evidence: unmeasured.
answer_rounds = 2 # optional
# Characters of a rendered brief (7.1f "about a page"): an unmeasured starting value.
page_chars = 3000 # optional
# Behaviors per red brief (7.1f dispatch cap): an unmeasured starting value.
red_behaviors = 6 # optional
# Optional: the folder holding approved specs. Spec paths in a step file
# (red and port origins, test-reviewer specs) must lie under it.
spec_dir = "docs/superpowers/specs/" # the default

# Reviewers run in this order after the group check, when the group changed a
# path equal to or under one of `paths`. Only diff-reviewer and test-reviewer
# have supported contracts. Roster entries contain only role and paths.
[[reviewers]]
role = "diff-reviewer"
paths = ["foreman/", "tests/"]

[[reviewers]]
role = "test-reviewer"
paths = ["tests/"]

# Optional: the target repository's builder roles. Each role maps to the
# folders (ending "/") and single files its steps may write; a single file
# covers only itself. Omitting the table means these Gauntlet defaults.
# test-writer, diff-reviewer and test-reviewer are fixed and cannot be listed.
[builders]
core-builder = ["gauntlet/core/", "gauntlet/__init__.py"]
seam-builder = ["gauntlet/seams/"]

# Review content belongs in the step file, separately from this roster.
# To request explicit test-reviewer specs for group g1, add there:
# [groups.g1.reviews.test-reviewer]
# scope = "working-tree"
# specs = ["docs/superpowers/specs/brief-forms-design.md"]
# Without a form, each reviewer uses its working-tree default. Group design
# metadata never adds specs; diff-reviewer does not accept specs.
